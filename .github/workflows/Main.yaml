name: "🔄 Auto-update VPN Configs & Sync GitVerse"

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Europe/Moscow
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  update-and-sync:
    name: "📥 Fetch, Update & Push Everywhere"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "📦 Install dependencies"
        run: pip install requests beautifulsoup4 lxml

      - name: "🔑 Setup SSH for GitVerse"
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITVERSE_SSH_KEY }}

      - name: "🔐 Known hosts для gitverse.ru"
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H gitverse.ru >> ~/.ssh/known_hosts 2>/dev/null

      - name: "📁 Prepare directories & generate all files"
        run: |
          mkdir -p VPNMIRRORS configs sources scripts
          python scripts/fetch_configs.py

          export GENERATED_AT="$(date '+%d.%m.%Y %H:%M:%S') (MSK)"
          python scripts/generate_readme.py
          python scripts/site.py

      - name: "📊 Count VPN files"
        id: count
        run: |
          VPN_FILES=$(find VPNMIRRORS configs -type f ! -name "metadata.json" 2>/dev/null | wc -l)
          echo "vpn_files=$VPN_FILES" >> "$GITHUB_OUTPUT"

      - name: "🚀 Commit & Push to GitHub and GitVerse"
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          git config user.name "gitverse-bot"
          git config user.email "bot@gitverse.ru"

          # ═════════════════════════════════════════════════════
          # 0. Чистим локальные остатки _partN от прошлых запусков
          #    (после перехода на SSH они больше не нужны)
          # ═════════════════════════════════════════════════════
          echo "0. Чищу старые _partN-файлы от предыдущих запусков..."
          find VPNMIRRORS configs -type f -name "*_part[0-9]*.*" -print -delete 2>/dev/null || true

          git add -A
          COMMIT_DATE=$(date --iso-8601=seconds)
          IF_CHANGES=$(git status --porcelain)

          if [ -z "$IF_CHANGES" ] && [ "${{ inputs.force_update }}" != "true" ]; then
            echo "ℹ️ Свежих изменений нет. Пропуск отправки."
            exit 0
          fi

          echo "Обнаружены свежие файлы. Создаем коммит..."
          if [ -z "$IF_CHANGES" ]; then
            GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --allow-empty --date="$COMMIT_DATE" \
              -m "🔄 Forced Sync: $(date '+%Y-%m-%d %H:%M:%S MSK')"
          else
            GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --date="$COMMIT_DATE" \
              -m "🔄 Auto-update: $(date '+%Y-%m-%d %H:%M:%S MSK') — configs: ${{ steps.count.outputs.vpn_files }}"
          fi

          # ═════════════════════════════════════════════════════
          # 1. Push в GitHub (оригиналы, общий README)
          # ═════════════════════════════════════════════════════
          echo "1. Пушим свежие файлы в GitHub..."
          git push origin HEAD

          # ═════════════════════════════════════════════════════
          # 2. Push в GitVerse по SSH — одним запросом, без split
          #    и без пересборки README. SSH не имеет HTTP-лимита
          #    на размер packfile, поэтому большой файл 100 МБ
          #    уйдёт целиком без проблем.
          # ═════════════════════════════════════════════════════
          echo "2. Пушим в GitVerse по SSH..."

          git remote add gitverse "git@gitverse.ru:RUVIPIEN/russian-white-bolt_fix.git" 2>/dev/null || \
          git remote set-url gitverse "git@gitverse.ru:RUVIPIEN/russian-white-bolt_fix.git"

          GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30" \
            git push gitverse HEAD:refs/heads/master --force

          echo "✅ Успешно обновлено на всех серверах!"
