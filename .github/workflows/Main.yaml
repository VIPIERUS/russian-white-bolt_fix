Name: "🔄 Auto-update VPN Configs & Sync GitVerse"

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Europe/Moscow
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  update-and-sync:
    name: "📥 Fetch, Update & Push Everywhere"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "📦 Install dependencies"
        run: pip install requests beautifulsoup4 lxml

      - name: "📁 Prepare directories & generate all files"
        run: |
          mkdir -p VPNMIRRORS configs sources scripts
          python scripts/fetch_configs.py

          export GENERATED_AT="$(date '+%d.%m.%Y %H:%M:%S') (MSK)"
          python scripts/generate_readme.py
          python scripts/site.py

      - name: "📊 Count VPN files"
        id: count
        run: |
          VPN_FILES=$(find VPNMIRRORS configs -type f ! -name "metadata.json" 2>/dev/null | wc -l)
          echo "vpn_files=$VPN_FILES" >> "$GITHUB_OUTPUT"

      - name: "🚀 Commit & Push to GitHub and GitVerse"
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # Настройка бота
          git config user.name "gitverse-bot"
          git config user.email "bot@gitverse.ru"

          # Индексируем все изменения
          git add -A

          COMMIT_DATE=$(date --iso-8601=seconds)

          # Проверяем, есть ли изменения или принудительный запуск
          IF_CHANGES=$(git status --porcelain)

          if [ -n "$IF_CHANGES" ] || [ "${{ inputs.force_update }}" = "true" ]; then
            echo "Обнаружены свежие файлы. Создаем коммит..."

            # Если изменений не было, но вызван force_update — делаем пустой коммит
            if [ -z "$IF_CHANGES" ]; then
              GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --allow-empty --date="$COMMIT_DATE" -m "🔄 Forced Sync: $(date '+%Y-%m-%d %H:%M:%S MSK')"
            else
              GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --date="$COMMIT_DATE" -m "🔄 Auto-update: $(date '+%Y-%m-%d %H:%M:%S MSK') — configs: ${{ steps.count.outputs.vpn_files }}"
            fi

            echo "1. Пушим свежие файлы в GitHub..."
            git push origin HEAD

            echo "2. Пушим свежие файлы в GitVerse (в ветку master)..."
            git remote add gitverse "https://RUVIPIEN:${GITVERSE_TOKEN}@gitverse.ru/RUVIPIEN/russian-white-bolt_fix.git" 2>/dev/null || \
            git remote set-url gitverse "https://RUVIPIEN:${GITVERSE_TOKEN}@gitverse.ru/RUVIPIEN/russian-white-bolt_fix.git"
            git -c core.askPass= push gitverse HEAD:refs/heads/master --force

            echo "✅ Успешно обновлено на всех серверах!"
          else
            echo "ℹ️ Свежих изменений нет. Пропуск отправки."
          fi
