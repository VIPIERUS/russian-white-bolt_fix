name: "🔄 Auto-update VPN Configs & Sync GitVerse"

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Europe/Moscow
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  update-and-sync:
    name: "📥 Fetch, Update & Push Everywhere"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "📦 Install dependencies"
        run: pip install requests beautifulsoup4 lxml

      - name: "📁 Prepare directories & generate all files"
        run: |
          mkdir -p VPNMIRRORS configs sources scripts
          python scripts/fetch_configs.py

          export GENERATED_AT="$(date '+%d.%m.%Y %H:%M:%S') (MSK)"
          python scripts/generate_readme.py
          python scripts/site.py

      - name: "📊 Count VPN files"
        id: count
        run: |
          VPN_FILES=$(find VPNMIRRORS configs -type f ! -name "metadata.json" 2>/dev/null | wc -l)
          echo "vpn_files=$VPN_FILES" >> "$GITHUB_OUTPUT"

      - name: "🚀 Commit & Push to GitHub and GitVerse"
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          git config user.name "gitverse-bot"
          git config user.email "bot@gitverse.ru"

          # ═════════════════════════════════════════════════════
          # 0. Чистим локальную копию от старых _partN-файлов
          #    (могут остаться от предыдущих прогонов, если что-то
          #    прерывалось посередине).
          # ═════════════════════════════════════════════════════
          echo "0. Чищу старые _partN-файлы от предыдущих запусков..."
          find VPNMIRRORS configs -type f -name "*_part[0-9]*.*" -print -delete 2>/dev/null || true

          git add -A
          COMMIT_DATE=$(date --iso-8601=seconds)
          IF_CHANGES=$(git status --porcelain)

          if [ -z "$IF_CHANGES" ] && [ "${{ inputs.force_update }}" != "true" ]; then
            echo "ℹ️ Свежих изменений нет. Пропуск отправки."
            exit 0
          fi

          echo "Обнаружены свежие файлы. Создаем коммит..."
          if [ -z "$IF_CHANGES" ]; then
            GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --allow-empty --date="$COMMIT_DATE" \
              -m "🔄 Forced Sync: $(date '+%Y-%m-%d %H:%M:%S MSK')"
          else
            GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --date="$COMMIT_DATE" \
              -m "🔄 Auto-update: $(date '+%Y-%m-%d %H:%M:%S MSK') — configs: ${{ steps.count.outputs.vpn_files }}"
          fi

          # ═════════════════════════════════════════════════════
          # 1. Push в GitHub (оригиналы, общий README)
          # ═════════════════════════════════════════════════════
          echo "1. Пушим свежие файлы в GitHub (оригиналы + общий README)..."
          git push origin HEAD

          # ═════════════════════════════════════════════════════
          # 2. Split больших файлов для GitVerse
          # ═════════════════════════════════════════════════════
          LIMIT_MB=40
          echo "2. Разбиваю файлы > ${LIMIT_MB} МБ для GitVerse..."

          SPLIT_ANY=0
          MAP_FILE=$(mktemp)   # карта: оригинал<TAB>part1,part2,...

          while IFS= read -r -d '' file; do
            SPLIT_ANY=1
            dir=$(dirname "$file")
            filename=$(basename "$file")
            base="${filename%.*}"
            ext="${filename##*.}"

            echo "  → $file ($(du -h "$file" | cut -f1)) → ${base}_partN.${ext}"

            split -b "${LIMIT_MB}M" -d --numeric-suffixes=1 -a 1 \
                  --additional-suffix=".${ext}" \
                  "$file" "${dir}/${base}_part"

            rm -f "$file"

            parts=$(ls "${dir}/${base}_part"*".${ext}" | xargs -n1 basename | paste -sd, -)
            printf '%s\t%s\n' "$filename" "$parts" >> "$MAP_FILE"
          done < <(find VPNMIRRORS configs -type f -size +${LIMIT_MB}M -print0 2>/dev/null)

          # ═════════════════════════════════════════════════════
          # 3. Пересборка README/HTML для GitVerse (чисто YAML)
          #    Локальный README идентичен тому, что ушёл в GitHub.
          #    Здесь только подменяем имена файлов на список частей
          #    и дописываем предупреждение сверху.
          # ═════════════════════════════════════════════════════
          if [ "$SPLIT_ANY" = "1" ]; then
            echo "3. Пересобираю README/HTML для GitVerse..."

            while IFS=$'\t' read -r orig parts; do
              first=$(echo "$parts" | cut -d, -f1)
              rest=$(echo "$parts" | cut -d, -f2- | tr ',' ' ')

              if [ -n "$rest" ] && [ "$rest" != "$first" ]; then
                replacement="${first} (плюс части: ${rest})"
              else
                replacement="${first}"
              fi

              echo "    • $orig"
              echo "        → $replacement"

              find . -type f \( -name "*.md" -o -name "*.html" -o -name "*.json" -o -name "*.txt" \) \
                   -not -path "./.git/*" -not -path "./.github/*" -print0 \
                | xargs -0 -r grep -l -- "$orig" 2>/dev/null \
                | while IFS= read -r f; do
                    ORIG="$orig" REPL="$replacement" perl -i -pe '
                      my $o = $ENV{ORIG};
                      my $r = $ENV{REPL};
                      s/\Q$o\E/$r/g;
                    ' "$f"
                  done
            done < "$MAP_FILE"

            if [ -f README.md ] && ! grep -q "Внимание (GitVerse)" README.md; then
              NOTE=$(mktemp)
              {
                echo "> ⚠️ **Внимание (GitVerse):** некоторые файлы разбиты на части из-за лимита загрузки."
                echo "> Скачивайте **все** части и объединяйте:"
                echo "> \`cat file_part* > file\` (Linux/macOS) или \`copy /b file_part* file\` (Windows)."
                echo
              } > "$NOTE"
              cat README.md >> "$NOTE"
              mv "$NOTE" README.md
            fi

            git add -A
            GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --amend --no-edit --date="$COMMIT_DATE"
            echo "  ✓ README пересобран для GitVerse"
          else
            echo "3. Файлов > ${LIMIT_MB} МБ нет — README не трогаем"
          fi

          rm -f "$MAP_FILE"

          # ═════════════════════════════════════════════════════
          # 4. Push в GitVerse: ЯВНОЕ УДАЛЕНИЕ старья + заливка
          # ═════════════════════════════════════════════════════
          echo "4. Пушим в GitVerse..."

          git remote add gitverse "https://RUVIPIEN:${GITVERSE_TOKEN}@gitverse.ru/RUVIPIEN/russian-white-bolt_fix.git" 2>/dev/null || \
          git remote set-url gitverse "https://RUVIPIEN:${GITVERSE_TOKEN}@gitverse.ru/RUVIPIEN/russian-white-bolt_fix.git"

          GIT_PUSH=(git -c core.askPass= \
                        -c http.postBuffer=1073741824 \
                        -c http.lowSpeedLimit=0 \
                        -c http.lowSpeedTime=999999 \
                        push gitverse HEAD:refs/heads/master --force)

          # ─────────────────────────────────────────────────────
          # 4.1. ЯВНОЕ УДАЛЕНИЕ
          # Смотрим, что из старых _partN лежит в текущем HEAD
          # (это ровно то, что уже есть в GitVerse до нашего push'а).
          # Отправляем их удаление отдельным коммитом в ветке-
          # снапшоте. Пакет удаления содержит только имена путей,
          # вес почти нулевой → 413 не грозит.
          # ─────────────────────────────────────────────────────
          echo "  4.1. Явное удаление старых файлов на GitVerse..."

          DELETE_LIST=$(mktemp)
          git ls-tree -r --name-only HEAD | grep -E '_part[0-9]+\.' > "$DELETE_LIST" || true

          if [ -s "$DELETE_LIST" ]; then
            echo "    Список к удалению на GitVerse:"
            sed 's/^/      /' "$DELETE_LIST"

            git checkout -b gitverse-delete 2>/dev/null || git checkout gitverse-delete
            git reset --hard HEAD >/dev/null

            while IFS= read -r path; do
              git rm --cached --ignore-unmatch -- "$path" >/dev/null 2>&1 || true
            done < "$DELETE_LIST"

            git add -A
            GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --date="$COMMIT_DATE" \
              -m "🗑️ GitVerse: удаление старых файлов перед обновлением" >/dev/null

            echo "    → Push удаления на GitVerse (маленький пакет)"
            "${GIT_PUSH[@]}"

            git checkout main >/dev/null 2>&1
            git branch -D gitverse-delete >/dev/null 2>&1 || true
          else
            echo "    Нечего удалять — старых _partN в GitVerse нет."
          fi

          rm -f "$DELETE_LIST"

          # ─────────────────────────────────────────────────────
          # 4.2. ЗАЛИВКА АКТУАЛЬНОГО НАБОРА
          # Отправляем коммит по частям: сначала лёгкий контент,
          # потом крупные _partN по одному — чтобы ни один push
          # не превысил HTTP-лимит.
          # ─────────────────────────────────────────────────────
          echo "  4.2. Заливаю актуальный набор на GitVerse..."

          HEAVY_DIR=$(mktemp -d)
          HEAVY_LIST=$(mktemp)
          while IFS= read -r -d '' f; do
            mkdir -p "${HEAVY_DIR}/$(dirname "$f")"
            mv "$f" "${HEAVY_DIR}/$f"
            printf '%s\n' "$f" >> "$HEAVY_LIST"
          done < <(find VPNMIRRORS configs -type f -name "*_part[0-9]*.*" -print0 2>/dev/null)

          git add -A
          GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --amend --no-edit --date="$COMMIT_DATE" >/dev/null

          echo "    → Push #1: лёгкий контент + README (без _partN)"
          "${GIT_PUSH[@]}"

          if [ -s "$HEAVY_LIST" ]; then
            while IFS= read -r f; do
              size=$(stat -c%s "${HEAVY_DIR}/$f")
              printf '%s\t%s\n' "$size" "$f"
            done < "$HEAVY_LIST" | sort -n | while IFS=$'\t' read -r size f; do
              human=$(numfmt --to=iec-i --suffix=B "$size")
              echo "    → Push: $f (${human})"
              mkdir -p "$(dirname "$f")"
              mv "${HEAVY_DIR}/$f" "$f"
              git add -A
              GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --amend --no-edit --date="$COMMIT_DATE" >/dev/null
              "${GIT_PUSH[@]}"
            done
          fi

          rm -rf "$HEAVY_DIR" "$HEAVY_LIST"

          echo "✅ Успешно обновлено на всех серверах!"
