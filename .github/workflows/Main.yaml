name: "🔄 Auto-update VPN Configs & Sync GitVerse"

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Europe/Moscow
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  update-and-sync:
    name: "📥 Fetch, Update & Push Everywhere"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "📦 Install dependencies"
        run: pip install requests beautifulsoup4 lxml

      - name: "📁 Prepare directories & generate all files"
        run: |
          mkdir -p VPNMIRRORS configs sources scripts
          python scripts/fetch_configs.py

          export GENERATED_AT="$(date '+%d.%m.%Y %H:%M:%S') (MSK)"
          python scripts/generate_readme.py
          python scripts/site.py

      - name: "📊 Count VPN files"
        id: count
        run: |
          VPN_FILES=$(find VPNMIRRORS configs -type f ! -name "metadata.json" 2>/dev/null | wc -l)
          echo "vpn_files=$VPN_FILES" >> "$GITHUB_OUTPUT"

      - name: "🚀 Commit & Push to GitHub and GitVerse"
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          # Настройка бота
          git config user.name "gitverse-bot"
          git config user.email "bot@gitverse.ru"

          git add -A
          COMMIT_DATE=$(date --iso-8601=seconds)
          IF_CHANGES=$(git status --porcelain)

          if [ -z "$IF_CHANGES" ] && [ "${{ inputs.force_update }}" != "true" ]; then
            echo "ℹ️ Свежих изменений нет. Пропуск отправки."
            exit 0
          fi

          echo "Обнаружены свежие файлы. Создаем коммит..."
          if [ -z "$IF_CHANGES" ]; then
            GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --allow-empty --date="$COMMIT_DATE" \
              -m "🔄 Forced Sync: $(date '+%Y-%m-%d %H:%M:%S MSK')"
          else
            GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --date="$COMMIT_DATE" \
              -m "🔄 Auto-update: $(date '+%Y-%m-%d %H:%M:%S MSK') — configs: ${{ steps.count.outputs.vpn_files }}"
          fi

          echo "1. Пушим свежие файлы в GitHub (оригиналы)..."
          git push origin HEAD

          # ─────────────────────────────────────────────────────
          # 2. Готовим версию для GitVerse: режем файлы > 90 МБ
          # ─────────────────────────────────────────────────────
          LIMIT_MB=90
          echo "2. Разбиваю файлы > ${LIMIT_MB} МБ для GitVerse..."

          SPLIT_ANY=0
          while IFS= read -r -d '' file; do
            SPLIT_ANY=1
            dir=$(dirname "$file")
            filename=$(basename "$file")
            base="${filename%.*}"
            ext="${filename##*.}"

            echo "  → $file ($(du -h "$file" | cut -f1)) → ${base}_partN.${ext}"

            # Режем на куски по LIMIT_MB, суффиксы: _part1, _part2, ...
            split -b "${LIMIT_MB}M" -d --numeric-suffixes=1 -a 1 \
                  --additional-suffix=".${ext}" \
                  "$file" "${dir}/${base}_part"

            rm -f "$file"
          done < <(find VPNMIRRORS configs -type f -size +${LIMIT_MB}M -print0 2>/dev/null)

          if [ "$SPLIT_ANY" = "1" ]; then
            git add -A
            GIT_COMMITTER_DATE="$COMMIT_DATE" git commit --amend --no-edit --date="$COMMIT_DATE"
            echo "  ✓ Коммит пересобран для GitVerse"
          else
            echo "  ✓ Файлов > ${LIMIT_MB} МБ нет, GitVerse получит оригинал"
          fi

          # ─────────────────────────────────────────────────────
          # 3. Пуш в GitVerse
          # ─────────────────────────────────────────────────────
          echo "3. Пушим в GitVerse (ветка master)..."
          git remote add gitverse "https://RUVIPIEN:${GITVERSE_TOKEN}@gitverse.ru/RUVIPIEN/russian-white-bolt_fix.git" 2>/dev/null || \
          git remote set-url gitverse "https://RUVIPIEN:${GITVERSE_TOKEN}@gitverse.ru/RUVIPIEN/russian-white-bolt_fix.git"

          git -c core.askPass= push gitverse HEAD:refs/heads/master --force

          echo "✅ Успешно обновлено на всех серверах!"
