name: "🔄 Auto-update VPN Configs"

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

env:
  TZ: Europe/Moscow
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  update-configs:
    name: "📥 Fetch & Update VPN Configs"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: "📂 Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITVERSE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      
      - name: "📦 Install dependencies"
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4 lxml
          fi
      
      - name: "🌐 Fetch VPN configurations"
        run: |
          mkdir -p VPNMIRRORS sources scripts
          python scripts/fetch_configs.py
          if [ ! -f "VPNMIRRORS/metadata.json" ]; then
            echo '{"updated":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","success":0,"failed":0,"skipped":0,"total_configs":0}' > VPNMIRRORS/metadata.json
          fi
      
      - name: "📝 Generate README.md"
        run: |
          if [ -f "scripts/generate_readme.py" ]; then
            python scripts/generate_readme.py
          fi
      
      - name: "🌐 Generate index.html"
        run: |
          if [ -f "scripts/site.py" ]; then
            python scripts/site.py
          fi
      
      - name: "📊 Count files"
        id: count
        run: |
          VPN_FILES=$(find VPNMIRRORS -type f ! -name "metadata.json" 2>/dev/null | wc -l)
          VPN_SIZE=$(du -sh VPNMIRRORS 2>/dev/null | cut -f1)
          echo "vpn_files=$VPN_FILES" >> $GITHUB_OUTPUT
          echo "vpn_size=$VPN_SIZE" >> $GITHUB_OUTPUT
          if [ -f "VPNMIRRORS/metadata.json" ]; then
            TOTAL_CONFIGS=$(cat VPNMIRRORS/metadata.json | python -c "import json,sys; print(json.load(sys.stdin).get('total_configs', 0))")
            echo "total_configs=$TOTAL_CONFIGS" >> $GITHUB_OUTPUT
          fi
      
      - name: "💾 Commit and push changes"
        run: |
          git config --global user.name "gitverse-bot"
          git config --global user.email "bot@gitverse.ru"
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.force_update }}" == "true" ]; then
              git commit --allow-empty -m "🔄 Force update: $(date +'%Y-%m-%d %H:%M MSK')"
              git push origin HEAD
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          else
            git commit -m "🔄 Auto-update: $(date +'%Y-%m-%d %H:%M MSK')
          📊 Statistics:
          - VPN Files: ${{ steps.count.outputs.vpn_files }}
          - Total Configs: ${{ steps.count.outputs.total_configs }}
          - Folder Size: ${{ steps.count.outputs.vpn_size }}"
            git push origin HEAD
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: "📤 Deploy to Beget via FTPS"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          security: strict
          exclude: |
            .git/
            .github/
            scripts/
            *.log
            .env
            requirements.txt
      
      - name: "📋 Generate execution report"
        if: always()
        run: |
          echo "## 🔄 VPN Auto-Update Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ⏰ **Time** | $(date +'%Y-%m-%d %H:%M:%S MSK') |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 **VPN Files** | ${{ steps.count.outputs.vpn_files || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔢 **Total Configs** | ${{ steps.count.outputs.total_configs || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 **Folder Size** | ${{ steps.count.outputs.vpn_size || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY