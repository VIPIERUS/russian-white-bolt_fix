name: "🔄 Auto-update VPN Configs"

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Europe/Moscow
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  update-configs:
    name: "📥 Fetch & Update VPN Configs"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: "📂 Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITVERSE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: "📦 Install dependencies"
        run: pip install requests beautifulsoup4 lxml
      
      - name: "🌐 Fetch VPN configs"
        run: |
          mkdir -p VPNMIRRORS sources scripts
          python scripts/fetch_configs.py
      
      - name: "📝 Generate README"
        run: python scripts/generate_readme.py
      
      - name: "🌐 Generate index.html"
        run: python scripts/site.py
      
      - name: "📊 Count files"
        id: count
        run: |
          VPN_FILES=$(find VPNMIRRORS -type f ! -name "metadata.json" 2>/dev/null | wc -l)
          echo "vpn_files=$VPN_FILES" >> $GITHUB_OUTPUT
      
      - name: "💾 Commit and push"
        run: |
          git config user.name "gitverse-bot"
          git config user.email "bot@gitverse.ru"
          git add -A
          git diff --cached --quiet || git commit -m "🔄 Auto-update: $(date)"
          git push origin HEAD
      
      - name: "📤 Upload to Beget via FTP (Python)"
        run: |
          python -c "
import ftplib
import os

FTP_HOST = '${{ secrets.FTP_SERVER }}'
FTP_USER = '${{ secrets.FTP_USERNAME }}'
FTP_PASS = '${{ secrets.FTP_PASSWORD }}'

try:
    ftp = ftplib.FTP(FTP_HOST)
    ftp.login(FTP_USER, FTP_PASS)
    ftp.cwd('/public_html')
    
    for file in ['index.html', 'README.md']:
        if os.path.exists(file):
            with open(file, 'rb') as f:
                ftp.storbinary(f'STOR {file}', f)
                print(f'✅ Uploaded: {file}')
    
    ftp.quit()
    print('✅ FTP upload completed!')
except Exception as e:
    print(f'❌ FTP error: {e}')
    exit(1)
"